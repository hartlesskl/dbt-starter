      - name: total_amount__raw
        description: "Total charged to passengers in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: congestion_surcharge__raw
        description: "New York State congestion surcharge collected, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: airport_fee__raw
        description: "Fee for pickups at the two main airports, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: cbd_congestion_fee__raw
        description: "Per-trip fee for the Manhattan congestion pricing zone, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: store_and_fwd_flag
        description: "Whether the record was held in vehicle memory before it was sent (Y or N), as landed text."
      - name: vendor_id
        description: "Id of the provider that supplied the record, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: pickup_datetime
        description: "Date and time the meter was engaged, converted to a timestamp. NULL when the landed text is empty or cannot be converted."
      - name: dropoff_datetime
        description: "Date and time the meter was disengaged, converted to a timestamp. NULL when the landed text is empty or cannot be converted."
      - name: passenger_count
        description: "Number of passengers as entered by the driver, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: trip_distance
