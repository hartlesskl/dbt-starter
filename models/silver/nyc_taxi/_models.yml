version: 2

models:
  - name: silver__taxi_zones
    description: >
      The zones that passed every quarantine rule, one row per zone, with two helper columns.
      Zone ids 264 and 265 are valid published zones for unknown and outside-NYC locations,
      so they are kept and marked rather than removed.
    data_tests:
      - starter.no_shared_keys:
          name: taxi_zones_silver_and_quarantine_do_not_overlap
          arguments:
            other_model: "ref('silver__taxi_zones_quarantine')"
            column_name: zone_key
          config:
            severity: error
    columns:
      - name: zone_key
        description: Row key carried from bronze, a hash of the source file name and the row number.
        data_tests:
          - unique
          - not_null
      - name: _source_file
        description: Name of the file this row was loaded from.
      - name: _source_row_number
        description: Position of the row in its source file, counting from 1 in file order.
      - name: _batch_id
        description: Fingerprint of the file content the row came from. Identical files give the same value. It lets a count check compare silver with bronze one file at a time.
      - name: location_id
        description: Zone id as an integer. Valid rows always have one, and each id appears once.
        data_tests:
          - unique
          - not_null
      - name: borough
        description: Borough name as landed, including the placeholders Unknown and N/A.
      - name: zone
        description: Zone name as landed. Names are not unique across zones.
      - name: service_zone
        description: Service zone name as landed. It may be NULL.
      - name: is_unknown_location
        description: 1 for zone ids 264 and 265, which the TLC publishes for unknown and outside-NYC locations, otherwise 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: is_airport
        description: 1 when the service zone is Airports or EWR, otherwise 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: silver__taxi_zones_quarantine
    description: >
      The rows that broke at least one quarantine rule, kept whole: the landed text, the load
      lineage, one 0/1 flag per rule and the reason codes. Nothing is dropped: every bronze row
      is in silver or in this table, never both. The table exists even when no row failed, and
      is then empty.
    columns:
      - name: zone_key
        description: Row key carried from bronze, a hash of the source file name and the row number.
        data_tests:
          - unique
          - not_null
      - name: _source_file
        description: Name of the file this row was loaded from.
      - name: _source_row_number
        description: Position of the row in its source file, counting from 1 in file order.
      - name: _batch_id
        description: Fingerprint of the file content the row came from. Identical files give the same value. It ties a quarantined row to the load that produced it.
      - name: _loaded_at
        description: UTC time the loader wrote the row, without a time zone.
      - name: location_id__raw
        description: Zone id exactly as landed, still text, because the integer id is NULL when the text cannot be converted.
      - name: location_id
        description: Zone id as an integer, or NULL when the landed text is empty or is not a whole number. It repeats when the row was quarantined for a duplicate id.
      - name: borough
        description: Borough name as landed. NULL when the row failed for a missing borough.
      - name: zone
        description: Zone name as landed.
      - name: service_zone
        description: Service zone name as landed.
      - name: dq_fail_zone_location_id_unparseable
        description: 1 when the landed id text is present but is not a whole number, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_location_id_missing
        description: 1 when the landed id is empty, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_borough_missing
        description: 1 when the borough is empty, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_borough_unknown
        description: 1 when the borough is present but is not in the known-boroughs seed, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_service_zone_unknown
        description: 1 when the service zone is present but is not in the known-service-zones seed, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_location_id_duplicate
        description: 1 when the same integer id appears on more than one row, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_failed_rule_count
        description: How many rules flagged the row. Always at least 1 in this table.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
      - name: dq_reason_codes
        description: The codes of the failed rules, in rule order, joined with a vertical bar. This delimited string is for display, so filter on the flag columns instead of splitting it.
        data_tests:
          - not_null

  - name: silver__yellow_trips
    description: >
      The trips that passed every error rule, one row per landed trip. The trip duration is
      carried over from bronze, which computes it from clamped times. Warn rules are counted in
      dq_warning_count but never remove a trip, so a zero-length trip, for example, is here.
    data_tests:
      - starter.no_shared_keys:
          name: yellow_trips_silver_and_quarantine_do_not_overlap
          arguments:
            other_model: "ref('silver__yellow_trips_quarantine')"
            column_name: trip_key
          config:
            severity: error
    columns:
      - name: trip_key
        description: "Row key, a hash of the source file name and the row number. It does not depend on the data values, so identical trips on different lines get different keys."
        data_tests:
          - unique
          - not_null
      - name: _source_file
        description: "Name of the file this row was loaded from. It carries the month the file belongs to."
      - name: _source_row_number
        description: "Position of the row in its source file, counting from 1 in file order."
      - name: _batch_id
        description: "Fingerprint of the file content the row came from. Identical files give the same value."
      - name: _loaded_at
        description: "UTC time the loader wrote the row, without a time zone."
      - name: duplicate_fingerprint
        description: "Hash of the landed text of every declared data column, so two exact duplicates share it. Silver keeps only the copy ranked first in bronze (the others are in quarantine as exact duplicates), so no value repeats here."
        data_tests:
          - unique
          - not_null
      - name: vendor_id
        description: "Id of the provider that supplied the record, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: pickup_datetime
        description: "Date and time the meter was engaged. Valid trips always have it."
        data_tests:
          - not_null
      - name: dropoff_datetime
        description: "Date and time the meter was disengaged. Valid trips always have it."
        data_tests:
          - not_null
      - name: passenger_count
        description: "Number of passengers as entered by the driver, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: trip_distance
        description: "Trip distance in miles reported by the taximeter, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: rate_code_id
        description: "Rate code in effect at the end of the trip, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: pu_location_id
        description: "Id of the taxi zone where the meter was engaged, converted to a whole number. Valid trips always have it, and it is a zone id in the zone lookup. Names are left to the gold dimensions."
        data_tests:
          - not_null
      - name: do_location_id
        description: "Id of the taxi zone where the meter was disengaged, converted to a whole number. Valid trips always have it, and it is a zone id in the zone lookup. Names are left to the gold dimensions."
        data_tests:
          - not_null
      - name: pu_is_unknown_zone
        description: "1 when the pickup zone id is 264 or 265, which the TLC publishes for unknown and outside-NYC locations, otherwise 0. It matches is_unknown_location in the zone table."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: do_is_unknown_zone
        description: "1 when the dropoff zone id is 264 or 265, which the TLC publishes for unknown and outside-NYC locations, otherwise 0. It matches is_unknown_location in the zone table."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: payment_type
        description: "Numeric code for how the passenger paid, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: fare_amount
        description: "Time-and-distance fare in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: extra
        description: "Miscellaneous extras and surcharges in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: mta_tax
        description: "Tax triggered automatically by the metered rate, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: tip_amount
        description: "Tip in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: tolls_amount
        description: "Total of all tolls paid during the trip, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: improvement_surcharge
        description: "Improvement surcharge assessed at flag drop, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: total_amount
        description: "Total charged to passengers in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: congestion_surcharge
        description: "New York State congestion surcharge collected, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: airport_fee
        description: "Fee for pickups at the two main airports, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: cbd_congestion_fee
        description: "Per-trip fee for the Manhattan congestion pricing zone, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: store_and_fwd_flag
        description: "Whether the record was held in vehicle memory before it was sent (Y or N), as landed text."
      - name: trip_duration_seconds
        description: "Trip length in whole seconds, computed once in bronze from the clamped pickup and dropoff times. NULL when either time is missing. Clamping keeps the count inside the range a T-SQL second count can hold, so a bad year such as 2088 cannot overflow it. Valid trips are never negative and never longer than the 24-hour limit that the rule registry holds."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: "{{ nyc_taxi__max_trip_seconds() }}"
      - name: dq_warning_count
        description: "How many warn rules the row failed (only warn rules count here; error rules are counted in dq_failed_rule_count). It is 0 when no warn rule flagged the row. Warn rules never move a row to quarantine."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 6
      - name: dq_warning_codes
        description: "The codes of the warn rules the row failed (error rule codes are in dq_reason_codes), joined with a vertical bar. NULL when there are none. This delimited string is for display, so count and filter on the rule flags instead of splitting it."

