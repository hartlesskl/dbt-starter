      - name: dq_fail_trip_pickup_datetime_missing
        description: "1 when the landed pickup time is empty, otherwise 0. Never NULL."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_dropoff_before_pickup
        description: "1 when the dropoff time is earlier than the pickup time, otherwise 0. A trip with either time missing is never flagged here. Never NULL."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
