version: 2

models:
  - name: gold__dim_zone
    description: >
      The zone dimension, one row per valid zone, ready to join to facts. The zone id the
      publisher assigns is the key, so there is no generated surrogate key.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [location_id]
        name: pk_dim_zone
    columns:
      - name: location_id
        data_type: int
        description: Zone id as an integer. It is the natural key of the dimension.
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: borough
        data_type: varchar(100)
        description: Borough name as published, including the placeholders Unknown and N/A.
      - name: zone
        data_type: varchar(100)
        description: Zone name as published. Names are not unique across zones.
      - name: service_zone
        data_type: varchar(100)
        description: Service zone name as published. It may be NULL.
      - name: is_unknown_location
        data_type: int
        description: 1 for zone ids 264 and 265, which the TLC publishes for unknown and outside-NYC locations, otherwise 0.
      - name: is_airport
        data_type: int
        description: 1 when the service zone is Airports or EWR, otherwise 0.

  - name: gold__dim_vendor
    description: >
      The vendor dimension, one row per vendor code the TLC data dictionary defines. The code
      the publisher assigns is the key, so there is no generated surrogate key. Adding a code to
      the vendor seed adds it here on the next build.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [vendor_id]
        name: pk_dim_vendor
    columns:
      - name: vendor_id
        data_type: int
        description: The vendor code as the TLC publishes it. It is the natural key of the dimension.
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: vendor_name
        data_type: varchar(60)
        description: The vendor name the data dictionary gives for the code.
        constraints:
          - type: not_null

  - name: gold__dim_rate_code
    description: >
      The rate code dimension, one row per rate code the TLC data dictionary defines. The code
      the publisher assigns is the key, so there is no generated surrogate key. Adding a code to
      the rate code seed adds it here on the next build.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [rate_code_id]
        name: pk_dim_rate_code
    columns:
      - name: rate_code_id
        data_type: int
        description: The rate code as the TLC publishes it. Code 99 is the published null or unknown rate. It is the natural key of the dimension.
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: rate_code_name
        data_type: varchar(60)
        description: The rate name the data dictionary gives for the code.
        constraints:
          - type: not_null

  - name: gold__dim_payment_type
    description: >
      The payment type dimension, one row per payment type code the TLC data dictionary
      defines. The code the publisher assigns is the key, so there is no generated surrogate
      key. Adding a code to the payment type seed adds it here on the next build.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [payment_type]
        name: pk_dim_payment_type
    columns:
      - name: payment_type
        data_type: int
        description: The payment type code as the TLC publishes it. Code 0 is a Flex Fare trip. It is the natural key of the dimension.
        constraints:
          - type: not_null
        data_tests:
          - unique
          - not_null
      - name: payment_type_name
        data_type: varchar(60)
        description: The payment type name the data dictionary gives for the code.
        constraints:
          - type: not_null

  - name: gold__fct_trips
    description: >
      The trip fact, one row per valid silver trip. It has keys to the calendar (pickup_date_key),
      to the zone dimension twice (pickup and dropoff) and to the vendor, rate code and payment
      type codes. The load lineage stays in silver; trip_key links back to it. Trips that are
      valid but suspicious are here too: filter them with dq_warning_count.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [trip_key]
        name: pk_fct_trips
    columns:
      - name: trip_key
        data_type: varchar(32)
        description: "Row key, a hash of the source file name and the row number. It is the key of the fact and links back to the lineage columns in silver."
        constraints:
          - type: not_null
        data_tests:
          - unique:
              name: fct_trips_trip_key_is_unique
          - not_null:
              name: fct_trips_trip_key_is_not_null
      - name: pickup_date_key
        data_type: int
        description: "The pickup day as an integer YYYYMMDD. It joins to date_key in the calendar dimension."
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: fct_trips_pickup_date_key_has_a_date
              arguments:
                to: ref('gold__dim_date')
                field: date_key
      - name: pu_location_id
        data_type: int
        description: "Id of the zone where the meter was engaged. It joins to location_id in the zone dimension."
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: fct_trips_pu_location_id_has_a_zone
              arguments:
                to: ref('gold__dim_zone')
                field: location_id
      - name: do_location_id
        data_type: int
        description: "Id of the zone where the meter was disengaged. It joins to location_id in the zone dimension."
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: fct_trips_do_location_id_has_a_zone
              arguments:
                to: ref('gold__dim_zone')
                field: location_id
      - name: vendor_id
        data_type: int
        description: "Id of the provider that supplied the record. It joins to vendor_id in the vendor dimension. NULL when silver could not convert it."
        data_tests:
          - relationships:
              name: fct_trips_vendor_id_has_a_vendor
              arguments:
                to: ref('gold__dim_vendor')
                field: vendor_id
      - name: rate_code_id
        data_type: int
        description: "Rate code in effect at the end of the trip. It joins to rate_code_id in the rate code dimension. NULL on Flex Fare trips, which carry none, and when silver could not convert it, so this column has no not_null test or constraint and the relationships test skips NULL."
        data_tests:
          - relationships:
              name: fct_trips_rate_code_id_has_a_rate_code
              arguments:
                to: ref('gold__dim_rate_code')
                field: rate_code_id
      - name: payment_type
        data_type: int
        description: "Numeric code for how the passenger paid. It joins to payment_type in the payment type dimension. NULL when silver could not convert it."
        data_tests:
          - relationships:
              name: fct_trips_payment_type_has_a_payment_type
              arguments:
                to: ref('gold__dim_payment_type')
                field: payment_type
      # The one documented exception to never branching on the target: no timestamp type string
      # works on both adapters (timestamp is rowversion on T-SQL, datetime2 does not exist in
      # DuckDB), and macros cannot run in YAML. Plan 03-02 records it as ADR 0004 and adds the
      # test that limits it to these two columns (D-21).
      - name: pickup_datetime
        data_type: "{{ 'timestamp' if target.type == 'duckdb' else 'datetime2(6)' }}"
        description: "Date and time the meter was engaged. Valid trips always have it."
        constraints:
          - type: not_null
      - name: dropoff_datetime
        data_type: "{{ 'timestamp' if target.type == 'duckdb' else 'datetime2(6)' }}"
        description: "Date and time the meter was disengaged. Valid trips always have it."
        constraints:
          - type: not_null
      - name: trip_duration_seconds
        data_type: int
        description: "Trip length in whole seconds, computed once in bronze from the clamped pickup and dropoff times."
      - name: passenger_count
        data_type: int
        description: "Number of passengers as entered by the driver. NULL when silver could not convert it."
      - name: trip_distance
        data_type: decimal(18,6)
        description: "Trip distance in miles reported by the taximeter, an exact decimal. NULL when silver could not convert it."
      - name: store_and_fwd_flag
        data_type: varchar(20)
        description: "Whether the record was held in vehicle memory before it was sent (Y or N)."
      - name: fare_amount
        data_type: decimal(18,6)
        description: "Time-and-distance fare in dollars, an exact decimal. NULL when silver could not convert it."
      - name: extra
        data_type: decimal(18,6)
        description: "Miscellaneous extras and surcharges in dollars, an exact decimal. NULL when silver could not convert it."
      - name: mta_tax
        data_type: decimal(18,6)
        description: "Tax triggered automatically by the metered rate in dollars, an exact decimal. NULL when silver could not convert it."
      - name: tip_amount
        data_type: decimal(18,6)
        description: "Tip in dollars, an exact decimal. NULL when silver could not convert it."
      - name: tolls_amount
        data_type: decimal(18,6)
        description: "Total of all tolls paid during the trip in dollars, an exact decimal. NULL when silver could not convert it."
      - name: improvement_surcharge
        data_type: decimal(18,6)
        description: "Improvement surcharge assessed at flag drop in dollars, an exact decimal. NULL when silver could not convert it."
      - name: total_amount
        data_type: decimal(18,6)
        description: "Total charged to passengers in dollars, an exact decimal. NULL when silver could not convert it."
      - name: congestion_surcharge
        data_type: decimal(18,6)
        description: "New York State congestion surcharge collected in dollars, an exact decimal. NULL when silver could not convert it."
      - name: airport_fee
        data_type: decimal(18,6)
        description: "Fee for pickups at the two main airports in dollars, an exact decimal. NULL when silver could not convert it."
      - name: cbd_congestion_fee
        data_type: decimal(18,6)
        description: "Per-trip fee for the Manhattan congestion pricing zone in dollars, an exact decimal. NULL when silver could not convert it."
      - name: dq_warning_count
        data_type: int
        description: "How many warn rules the trip failed. It is 0 when none flagged it. Filter on it to leave out suspicious trips."
        constraints:
          - type: not_null
      - name: dq_warning_codes
        data_type: varchar(400)
        description: "The codes of the warn rules the trip failed, joined with a vertical bar. NULL when there are none. It is for display, so filter on dq_warning_count."

  - name: gold__agg_trips_daily
    description: >
      The daily aggregate, one row per pickup day and pickup borough, built from the trip fact and
      the zone dimension, not from silver. Its measures are trip counts, passengers, distance and
      money. The build proves it reconciles to the fact, exactly, so a difference fails the build:
      for every pickup day the trip count and the total amount equal the fact's, and for every
      pickup day and borough each additive measure (trips, warned trips, passengers, distance,
      fare, tip and total amount) equals the fact's, with the borough read from the zone
      dimension. The two averages are derived from those sums and counts, so they are not
      reconciled on their own.
      Trips in the unknown zones roll up under the
      boroughs Unknown and N/A, so no trip is left out.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns: [pickup_date_key, pickup_borough]
        name: pk_agg_trips_daily
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          name: agg_trips_daily_grain_is_unique
          arguments:
            combination_of_columns: [pickup_date_key, pickup_borough]
      - starter.totals_reconcile:
          name: agg_trips_daily_reconciles_to_fct_trips
          arguments:
            compare_model: "ref('gold__fct_trips')"
            key_column: pickup_date_key
            measures:
              - name: trip_count
                model_expr: "sum(trip_count)"
                compare_expr: "count(*)"
              - name: total_amount
                model_expr: "sum(total_amount_sum)"
                compare_expr: "sum(total_amount)"
          config:
            severity: error
      - starter.totals_reconcile:
          name: agg_trips_daily_reconciles_by_borough_to_fct_trips
          arguments:
            compare_model: "ref('gold__fct_trips')"
            key_column: [pickup_date_key, pickup_borough]
            compare_key_column: [c.pickup_date_key, j.borough]
            compare_join_model: "ref('gold__dim_zone')"
            compare_join_on: "c.pu_location_id = j.location_id"
            measures:
              - name: trip_count
                model_expr: "sum(trip_count)"
                compare_expr: "count(*)"
              - name: warned_trips
                model_expr: "sum(warned_trip_count)"
                compare_expr: "sum(case when c.dq_warning_count > 0 then 1 else 0 end)"
              - name: passengers
                model_expr: "sum(total_passengers)"
                compare_expr: "sum(cast(c.passenger_count as bigint))"
              - name: distance
                model_expr: "sum(total_distance)"
                compare_expr: "sum(c.trip_distance)"
              - name: fare
                model_expr: "sum(fare_amount_sum)"
                compare_expr: "sum(c.fare_amount)"
              - name: tip
                model_expr: "sum(tip_amount_sum)"
                compare_expr: "sum(c.tip_amount)"
              - name: total_amount
                model_expr: "sum(total_amount_sum)"
                compare_expr: "sum(c.total_amount)"
          config:
            severity: error
    columns:
      - name: pickup_date_key
        data_type: int
        description: "The pickup day as an integer YYYYMMDD. It joins to date_key in the calendar dimension."
        constraints:
          - type: not_null
        data_tests:
          - relationships:
              name: agg_trips_daily_pickup_date_key_has_a_date
              arguments:
                to: ref('gold__dim_date')
                field: date_key
      - name: pickup_borough
        data_type: varchar(100)
        description: "The borough of the pickup zone, as published, including the placeholders Unknown and N/A. It comes from the zone dimension."
        constraints:
          - type: not_null
      - name: trip_count
        data_type: bigint
        description: "Number of trips picked up that day in that borough."
        constraints:
          - type: not_null
      - name: warned_trip_count
        data_type: bigint
        description: "How many of those trips failed at least one warn rule (dq_warning_count above 0)."
        constraints:
          - type: not_null
      - name: total_passengers
        data_type: bigint
        description: "Sum of passenger_count over the trips. Trips with no passenger count add nothing."
        constraints:
          - type: not_null
      - name: total_distance
        data_type: decimal(38,6)
        description: "Sum of trip_distance in miles, an exact decimal. Trips with no distance add nothing."
        constraints:
          - type: not_null
      - name: fare_amount_sum
        data_type: decimal(38,6)
        description: "Sum of fare_amount in dollars, an exact decimal. Trips with no fare add nothing."
        constraints:
          - type: not_null
      - name: tip_amount_sum
        data_type: decimal(38,6)
        description: "Sum of tip_amount in dollars, an exact decimal. Trips with no tip amount add nothing."
        constraints:
          - type: not_null
      - name: total_amount_sum
        data_type: decimal(38,6)
        description: "Sum of total_amount in dollars, an exact decimal. It reconciles to the fact's total for the day."
        constraints:
          - type: not_null
      - name: avg_fare
        data_type: decimal(18,6)
        description: "Mean fare_amount in dollars over the trips that have one, computed as fare_amount_sum divided by the number of fares. NULL when no trip has a fare."
      - name: avg_distance
        data_type: decimal(18,6)
        description: "Mean trip_distance in miles over the trips that have one, computed as total_distance divided by the number of distances. NULL when no trip has a distance."
