                quote: false
      - name: dq_fail_trip_exact_duplicate
        description: "1 when row repeats an earlier row exactly, otherwise 0. Never NULL. Error rule TRIP_EXACT_DUPLICATE: a row with 1 here moves to quarantine."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_zero_length
        description: "1 when dropoff time equals pickup time, otherwise 0. Never NULL. Warn rule TRIP_ZERO_LENGTH: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_zero_distance
        description: "1 when trip distance is zero, otherwise 0. Never NULL. Warn rule TRIP_ZERO_DISTANCE: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_zero_total
        description: "1 when total amount is zero, otherwise 0. Never NULL. Warn rule TRIP_ZERO_TOTAL: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_negative_fare
        description: "1 when fare amount is negative, otherwise 0. Never NULL. Warn rule TRIP_NEGATIVE_FARE: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_negative_total
        description: "1 when total amount is negative, otherwise 0. Never NULL. Warn rule TRIP_NEGATIVE_TOTAL: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_passenger_count_zero
        description: "1 when passenger count is zero, otherwise 0. Never NULL. Warn rule TRIP_PASSENGER_COUNT_ZERO: the row stays in silver and the warning is counted in dq_warning_count."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_is_valid
        description: "1 when no error rule flagged the row, otherwise 0. Silver keeps the rows with 1 and the quarantine table keeps the rows with 0. Warn rules never change it."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_failed_rule_count
        description: "How many error rules flagged the row. Warn rules are not counted here (see dq_warning_count). It is 0 for a valid row."
        data_tests:
          - not_null
      - name: dq_reason_codes
        description: "The codes of the failed error rules, in rule order, joined with a vertical bar. Warn rule codes are not listed here (see dq_warning_codes). NULL for a valid row. It is a display string, not a list to filter on."
      - name: dq_warning_count
        description: "How many warn rules the row failed (only warn rules count here; error rules are counted in dq_failed_rule_count). It is 0 when no warn rule flagged the row. Warn rules never move a row to quarantine."
        data_tests:
          - not_null
      - name: dq_warning_codes
        description: "The codes of the warn rules the row failed (error rule codes are in dq_reason_codes), joined with a vertical bar. NULL when there are none. This delimited string is for display, so count and filter on the rule flags instead of splitting it."
