version: 2

models:
  - name: bronze__nyc_taxi__taxi_zones
    description: >
      The landed zone lookup with every row kept. Text is converted to typed columns, each row
      gets a stable key, and one 0/1 flag per quarantine rule says whether the row broke that
      rule. Bad rows are not removed here: silver keeps the valid ones and the quarantine table
      keeps the rest, so nothing is lost.
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: "source('nyc_taxi', 'taxi_zones')"
    columns:
      - name: zone_key
        description: Row key, a hash of the source file name and the row number. It does not depend on the data values, so identical rows on different lines get different keys.
        data_tests:
          - unique
          - not_null
      - name: location_id__raw
        description: Zone id exactly as landed, still text. Kept so a row whose id cannot be converted still shows what the file said.
      - name: location_id
        description: Zone id as an integer, or NULL when the landed text is empty or is not a whole number. It is not unique in bronze, because rows that repeat an id are kept here and flagged by the duplicate rule.
      - name: location_id_count
        description: How many rows in bronze have this same integer zone id, counting the row itself. Rows with no integer id are counted together, so the number means nothing for them and the duplicate rule ignores them. A helper for the duplicate rule.
      - name: borough
        description: Borough name as landed. The published placeholders Unknown and N/A are valid values.
      - name: zone
        description: Zone name as landed. Names are not unique across zones, so no uniqueness test is placed on them.
      - name: service_zone
        description: Service zone name as landed. It is optional, so NULL is not an error.
      - name: _source_file
        description: Name of the file this row was loaded from.
      - name: _source_row_number
        description: Position of the row in its source file, counting from 1 in file order.
      - name: _batch_id
        description: Fingerprint of the file content the row came from. Identical files give the same value.
      - name: _loaded_at
        description: UTC time the loader wrote the row, without a time zone.
      - name: borough_found
        description: 1 when the borough text appears in the known-boroughs seed, otherwise 0. Matching is exact, so a different capital letter gives 0. A helper for the borough rule.
      - name: service_zone_found
        description: 1 when the service zone text appears in the known-service-zones seed, otherwise 0. Matching is exact. A helper for the service zone rule.
      - name: dq_fail_zone_location_id_unparseable
        description: 1 when the landed id text is present but is not a whole number, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_location_id_missing
        description: 1 when the landed id is empty, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_borough_missing
        description: 1 when the borough is empty, otherwise 0. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_borough_unknown
        description: 1 when the borough is present but is not in the known-boroughs seed, otherwise 0. An empty borough is left to the missing rule. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_service_zone_unknown
        description: 1 when the service zone is present but is not in the known-service-zones seed, otherwise 0. An empty service zone is allowed. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_zone_location_id_duplicate
        description: 1 when the integer id is present and the same id appears on more than one row, so every row that shares the id is flagged, otherwise 0. Rows with no id are never flagged here. Never NULL.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_is_valid
        description: 1 when no rule flagged the row, otherwise 0. Silver keeps the rows with 1 and the quarantine table keeps the rows with 0.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_failed_rule_count
        description: How many rules flagged the row. It is 0 for a valid row.
        data_tests:
          - not_null
      - name: dq_reason_codes
        description: The codes of the failed rules, in rule order, joined with a vertical bar. NULL for a valid row. It is a display string, not a list to filter on.

  - name: bronze__nyc_taxi__yellow_trips
    description: >
      Every landed trip, kept whole. Each declared value appears twice: as the landed text
      (the raw column) and converted to its typed value, so a value that cannot be converted
      stays visible. Pickup and dropoff times are also clamped to the years 2000 to 2050 before
      the duration is computed. One 0/1 flag per error rule says whether the row broke that
      rule, and the row is valid only when no error flag is set. One more flag per warn rule marks
      a suspicious but real value: it adds to the warning count and codes but never changes
      validity. Bad rows are not removed here: silver keeps the valid ones and the quarantine
      table keeps the rest.
    # No dbt_utils.equal_rowcount here, unlike the zone model: on an empty relation it returns
    # no row and dbt then fails the test with "None is not of type integer", and the zone split
    # test builds this project with an empty trips landing table on purpose. The landing =
    # bronze check for trips is the per-batch invariant test (TEST-02), which also handles empty.
    columns:
      - name: trip_key
        description: "Row key, a hash of the source file name and the row number. It does not depend on the data values, so identical trips on different lines get different keys."
        data_tests:
          - unique
          - not_null
      - name: vendor_id__raw
        description: "Id of the provider that supplied the record, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: vendor_id
        description: "Id of the provider that supplied the record, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: pickup_datetime__raw
        description: "Date and time the meter was engaged, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: pickup_datetime
        description: "Date and time the meter was engaged, converted to a timestamp. NULL when the landed text is empty or cannot be converted."
      - name: dropoff_datetime__raw
        description: "Date and time the meter was disengaged, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: dropoff_datetime
        description: "Date and time the meter was disengaged, converted to a timestamp. NULL when the landed text is empty or cannot be converted."
      - name: passenger_count__raw
        description: "Number of passengers as entered by the driver, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: passenger_count
        description: "Number of passengers as entered by the driver, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: trip_distance__raw
        description: "Trip distance in miles reported by the taximeter, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: trip_distance
        description: "Trip distance in miles reported by the taximeter, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: rate_code_id__raw
        description: "Rate code in effect at the end of the trip, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: rate_code_id
        description: "Rate code in effect at the end of the trip, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: pu_location_id__raw
        description: "Id of the taxi zone where the meter was engaged, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: pu_location_id
        description: "Id of the taxi zone where the meter was engaged, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: do_location_id__raw
        description: "Id of the taxi zone where the meter was disengaged, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: do_location_id
        description: "Id of the taxi zone where the meter was disengaged, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: payment_type__raw
        description: "Numeric code for how the passenger paid, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: payment_type
        description: "Numeric code for how the passenger paid, converted to a whole number. NULL when the landed text is empty or cannot be converted."
      - name: fare_amount__raw
        description: "Time-and-distance fare in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: fare_amount
        description: "Time-and-distance fare in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: extra__raw
        description: "Miscellaneous extras and surcharges in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: extra
        description: "Miscellaneous extras and surcharges in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: mta_tax__raw
        description: "Tax triggered automatically by the metered rate, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: mta_tax
        description: "Tax triggered automatically by the metered rate, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: tip_amount__raw
        description: "Tip in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: tip_amount
        description: "Tip in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: tolls_amount__raw
        description: "Total of all tolls paid during the trip, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: tolls_amount
        description: "Total of all tolls paid during the trip, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: improvement_surcharge__raw
        description: "Improvement surcharge assessed at flag drop, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: improvement_surcharge
        description: "Improvement surcharge assessed at flag drop, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: total_amount__raw
        description: "Total charged to passengers in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: total_amount
        description: "Total charged to passengers in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: congestion_surcharge__raw
        description: "New York State congestion surcharge collected, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: congestion_surcharge
        description: "New York State congestion surcharge collected, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: airport_fee__raw
        description: "Fee for pickups at the two main airports, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: airport_fee
        description: "Fee for pickups at the two main airports, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: cbd_congestion_fee__raw
        description: "Per-trip fee for the Manhattan congestion pricing zone, in dollars, exactly as landed and still text. Kept so a value that cannot be converted still shows what the file said."
      - name: cbd_congestion_fee
        description: "Per-trip fee for the Manhattan congestion pricing zone, in dollars, converted to a decimal number. NULL when the landed text is empty or cannot be converted."
      - name: store_and_fwd_flag
        description: "Whether the record was held in vehicle memory before it was sent (Y or N), as landed text. It has no rule, so an odd value is kept as it came."
      - name: source_month
        description: "First day of the month named in the source file name (yellow_tripdata_YYYY-MM.parquet). NULL when the file name has no month."
      - name: _source_file
        description: "Name of the file this row was loaded from. It carries the month the file belongs to."
      - name: _source_row_number
        description: "Position of the row in its source file, counting from 1 in file order."
      - name: _batch_id
        description: "Fingerprint of the file content the row came from. Identical files give the same value."
      - name: _loaded_at
        description: "UTC time the loader wrote the row, without a time zone."
      - name: pickup_month
        description: "First day of the month the trip was picked up in. NULL when the pickup time is missing."
      - name: pickup_clamped
        description: "Pickup time limited to the range 2000-01-01 to 2050-01-01, so a bad year cannot overflow the duration count. Used only to compute the duration."
      - name: dropoff_clamped
        description: "Dropoff time limited to the range 2000-01-01 to 2050-01-01, so a bad year cannot overflow the duration count. Used only to compute the duration."
      - name: trip_duration_seconds
        description: "Trip length in whole seconds, computed once in bronze from the clamped pickup and dropoff times. NULL when either time is missing. Clamping keeps the count inside the range a T-SQL second count can hold, so a bad year such as 2088 cannot overflow it."
      - name: duplicate_fingerprint
        description: "Hash of the landed text of every declared data column (the 20 trip columns, NULL written as a marker, the lineage columns left out), so a column joins the hash once it is declared. Two rows with the same value are exact duplicates, even when they come from different files."
      - name: duplicate_rank
        description: "1 for the copy of a trip that is kept, 2 and up for the copies after it. Among rows with the same duplicate_fingerprint, a copy whose pickup month equals the month of its file ranks first, then the order is file name and row number. A trip with no copy is 1."
        data_tests:
          - not_null
      - name: pu_zone_found
        description: "1 when the pickup zone id is one of the valid zones (the rows of the zone model with dq_is_valid 1), otherwise 0. A NULL id gives 0 and is left to the missing and unparseable rules."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: do_zone_found
        description: "1 when the dropoff zone id is one of the valid zones (the rows of the zone model with dq_is_valid 1), otherwise 0. A NULL id gives 0 and is left to the missing and unparseable rules."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: vendor_found
        description: "1 when the vendor id is in the vendors seed, otherwise 0. A NULL id gives 0 and is left to the unparseable rule."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: rate_code_found
        description: "1 when the rate code is in the rate codes seed, otherwise 0. A NULL rate code gives 0 and is allowed, because Flex Fare trips carry none."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: payment_type_found
        description: "1 when the payment type is in the payment types seed, otherwise 0. A NULL id gives 0 and is left to the unparseable rule."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_vendor_id_unparseable
        description: "1 when vendor id is not a whole number, otherwise 0. Never NULL. Error rule TRIP_VENDOR_ID_UNPARSEABLE: a row with 1 here moves to quarantine."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false
      - name: dq_fail_trip_pickup_datetime_unparseable
