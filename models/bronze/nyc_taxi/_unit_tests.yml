  - name: trip_warn_amount_rules
    description: >
      The warn rules on distance and money. A zero distance, a zero total, a negative fare
      and a negative total each set only their own warn flag: the row stays valid and the
      warning count and codes show the rule. NULL amounts are not suspicious and pass.
    model: bronze__nyc_taxi__yellow_trips
    given:
      - input: source('nyc_taxi', 'yellow_trips')
        rows:
          - {<<: *base_trip, _source_row_number: 1}
          - {<<: *base_trip, trip_distance: '0.00', _source_row_number: 2}
          - {<<: *base_trip, total_amount: '0', _source_row_number: 3}
          - {<<: *base_trip, fare_amount: '-5.0', _source_row_number: 4}
          - {<<: *base_trip, total_amount: '-5.0', _source_row_number: 5}
          - {<<: *base_trip, trip_distance: null, fare_amount: null, total_amount: null, _source_row_number: 6}
      - input: ref('bronze__nyc_taxi__taxi_zones')
        rows: *zones_rows
      - input: ref('nyc_taxi__vendors')
        rows: *vendors_rows
      - input: ref('nyc_taxi__rate_codes')
        rows: *rates_rows
      - input: ref('nyc_taxi__payment_types')
        rows: *payments_rows
    expect:
      rows:
        - {_source_row_number: 1, dq_fail_trip_zero_distance: 0, dq_fail_trip_zero_total: 0, dq_fail_trip_negative_fare: 0, dq_fail_trip_negative_total: 0, dq_is_valid: 1, dq_warning_count: 0, dq_warning_codes: null}
