        - {_source_row_number: 3, trip_duration_seconds: -1, dq_fail_trip_zero_length: 0, dq_fail_trip_passenger_count_zero: 0, dq_is_valid: 0, dq_failed_rule_count: 1, dq_reason_codes: 'TRIP_DROPOFF_BEFORE_PICKUP', dq_warning_count: 0, dq_warning_codes: null}
