  - name: trip_duplicate_rule
    description: >
      The exact duplicate rule. Two rows are duplicates when every declared landed data
      column has the same text (NULLs equal, lineage ignored), matched across files. The
      copy whose pickup month equals its file month ranks first; ties fall back to the file
      name and then the row number. Rows 1-2: two copies in one file, the second fails. Rows
      3-4: a January 2024 trip in the 2024-01 file and in the 2025-01 file, the in-month copy
      stays valid. Rows 5-6, the reverse pair: a January 2025 trip, so the 2025-01 copy is in
      month, takes rank 1 and stays valid although its file sorts later; the 2024-01 copy
      fails exactly OUT_OF_MONTH and EXACT_DUPLICATE and the real trip is kept once. Rows
      7-8: a March 2024 trip in two January and February files, no copy is in month, so the
      file name decides the rank and both rows are invalid. Rows 9-10 differ in one column,
      so both rank 1. Rows 11-12 differ only in lineage and both hold NULL passenger and
      rate code cells, so they are duplicates.
