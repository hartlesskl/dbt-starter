        - {_source_row_number: 5, trip_duration_seconds: 600, dq_fail_trip_zero_length: 0, dq_fail_trip_passenger_count_zero: 1, dq_is_valid: 1, dq_failed_rule_count: 0, dq_reason_codes: null, dq_warning_count: 1, dq_warning_codes: 'TRIP_PASSENGER_COUNT_ZERO'}
