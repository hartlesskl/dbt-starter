  - name: trip_warn_time_passenger_rules
    description: >
      The warn rules on time and passenger count, and the first rules of the registry. A
      zero-length trip and a zero passenger count are real but suspicious: the row stays
      valid with its warnings counted (row 7 has both). A NULL passenger count passes, which
      is how Flex Fare trips arrive. A ten-minute trip is clean, a dropoff one second before
      the pickup fails DROPOFF_BEFORE_PICKUP, and a trip with no pickup fails
      PICKUP_DATETIME_MISSING and has no duration.
    model: bronze__nyc_taxi__yellow_trips
    given:
      - input: source('nyc_taxi', 'yellow_trips')
        rows:
          - {<<: *base_trip, _source_row_number: 1}
          - {<<: *base_trip, tpep_pickup_datetime: '2024-01-16 09:00:00', tpep_dropoff_datetime: '2024-01-16 09:00:00', _source_row_number: 2}
