version: 2

# One unit test per group of rules. The zone tests mock the landing source and both known-values
# seeds; the trip tests mock the landing source, the valid zones of the zone model and the three
# code seeds. Every rule has an expect row where its flag is 0 and one where it is 1, and a
# pytest checks that mechanically. Every expect row in one test lists the same keys. The trip
# tests share one base trip and the zone and code lists through YAML anchors (&base_trip,
# &zones_rows, ...) defined in the first trip test.
unit_tests:
  - name: zone_location_id_rules
    description: >
      The location id rules and the row key. Rows 1 and 7 hold the same data but different row
      numbers, so their keys differ, and as they repeat id 1 the duplicate rule flags both. Row 6
      is entirely empty and still appears, with two reasons.
    model: bronze__nyc_taxi__taxi_zones
    given:
      - input: source('nyc_taxi', 'taxi_zones')
        rows:
          - {locationid: '1', borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 1, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: 'abc', borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 2, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: null, borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 3, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '1.5', borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 4, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '5.0', borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 5, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: null, borough: null, zone: null, service_zone: null, _source_file: 'f.csv', _source_row_number: 6, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '1', borough: 'Manhattan', zone: 'Alphabet City', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 7, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
      - input: ref('nyc_taxi__known_boroughs')
        rows:
          - {borough: 'Manhattan'}
      - input: ref('nyc_taxi__known_service_zones')
        rows:
          - {service_zone: 'Yellow Zone'}
    expect:
      rows:
        - {_source_row_number: 1, zone_key: '07aca16e41e1ea980453eaf90a21d764', location_id: 1, dq_fail_zone_location_id_unparseable: 0, dq_fail_zone_location_id_missing: 0, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_DUPLICATE'}
        - {_source_row_number: 2, zone_key: '1c5f3ab6e0739a2287b1d10d96894177', location_id: null, dq_fail_zone_location_id_unparseable: 1, dq_fail_zone_location_id_missing: 0, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_UNPARSEABLE'}
        - {_source_row_number: 3, zone_key: '0c5073738977fb6bc9f4565e95562d58', location_id: null, dq_fail_zone_location_id_unparseable: 0, dq_fail_zone_location_id_missing: 1, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_MISSING'}
        - {_source_row_number: 4, zone_key: '529b421d4b6699c9d75b6201e7a5fd33', location_id: null, dq_fail_zone_location_id_unparseable: 1, dq_fail_zone_location_id_missing: 0, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_UNPARSEABLE'}
        - {_source_row_number: 5, zone_key: 'aa22ba634ffd4160f8a91b92e17aa107', location_id: 5, dq_fail_zone_location_id_unparseable: 0, dq_fail_zone_location_id_missing: 0, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 1, dq_reason_codes: null}
        - {_source_row_number: 6, zone_key: '7978ec2a54354fef69a0dbafce0565e3', location_id: null, dq_fail_zone_location_id_unparseable: 0, dq_fail_zone_location_id_missing: 1, dq_fail_zone_borough_missing: 1, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_MISSING|ZONE_BOROUGH_MISSING'}
        - {_source_row_number: 7, zone_key: '1a1b08cea12add2be28dd8051fef885d', location_id: 1, dq_fail_zone_location_id_unparseable: 0, dq_fail_zone_location_id_missing: 0, dq_fail_zone_borough_missing: 0, dq_fail_zone_location_id_duplicate: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_DUPLICATE'}

  - name: zone_known_value_rules
    description: >
      The known-values rules. The borough seed lists Manhattan twice on purpose, so five input
      rows must give exactly five output rows. A value must match the seed exactly, a NULL
      borough is left to the missing rule, and a NULL service zone is allowed.
    model: bronze__nyc_taxi__taxi_zones
    given:
      - input: source('nyc_taxi', 'taxi_zones')
        rows:
          - {locationid: '1', borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 1, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '2', borough: null, zone: 'x', service_zone: 'Boro Zone', _source_file: 'f.csv', _source_row_number: 2, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '3', borough: 'Atlantis', zone: 'x', service_zone: 'Mars Zone', _source_file: 'f.csv', _source_row_number: 3, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '4', borough: 'manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 4, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '5', borough: 'Queens', zone: 'x', service_zone: null, _source_file: 'f.csv', _source_row_number: 5, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
      - input: ref('nyc_taxi__known_boroughs')
        rows:
          - {borough: 'Manhattan'}
          - {borough: 'Manhattan'}
          - {borough: 'Queens'}
      - input: ref('nyc_taxi__known_service_zones')
        rows:
          - {service_zone: 'Yellow Zone'}
          - {service_zone: 'Boro Zone'}
    expect:
      rows:
        - {_source_row_number: 1, dq_fail_zone_borough_missing: 0, dq_fail_zone_borough_unknown: 0, dq_fail_zone_service_zone_unknown: 0, dq_failed_rule_count: 0, dq_is_valid: 1, dq_reason_codes: null}
        - {_source_row_number: 2, dq_fail_zone_borough_missing: 1, dq_fail_zone_borough_unknown: 0, dq_fail_zone_service_zone_unknown: 0, dq_failed_rule_count: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_BOROUGH_MISSING'}
        - {_source_row_number: 3, dq_fail_zone_borough_missing: 0, dq_fail_zone_borough_unknown: 1, dq_fail_zone_service_zone_unknown: 1, dq_failed_rule_count: 2, dq_is_valid: 0, dq_reason_codes: 'ZONE_BOROUGH_UNKNOWN|ZONE_SERVICE_ZONE_UNKNOWN'}
        - {_source_row_number: 4, dq_fail_zone_borough_missing: 0, dq_fail_zone_borough_unknown: 1, dq_fail_zone_service_zone_unknown: 0, dq_failed_rule_count: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_BOROUGH_UNKNOWN'}
        - {_source_row_number: 5, dq_fail_zone_borough_missing: 0, dq_fail_zone_borough_unknown: 0, dq_fail_zone_service_zone_unknown: 0, dq_failed_rule_count: 0, dq_is_valid: 1, dq_reason_codes: null}

  - name: zone_duplicate_id_rule
    description: >
      The duplicate id rule. Ids 7, 007 and 7.0 are the same integer, so all three rows are
      flagged together. A unique id passes. Rows with no integer id (empty, or not a number)
      are never flagged as duplicates of each other, because each already has its own reason.
    model: bronze__nyc_taxi__taxi_zones
    given:
      - input: source('nyc_taxi', 'taxi_zones')
        rows:
          - {locationid: '7', borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 1, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '007', borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 2, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '7.0', borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 3, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: '8', borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 4, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: null, borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 5, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {locationid: null, borough: 'Manhattan', zone: 'x', service_zone: 'Yellow Zone', _source_file: 'f.csv', _source_row_number: 6, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
      - input: ref('nyc_taxi__known_boroughs')
        rows:
          - {borough: 'Manhattan'}
      - input: ref('nyc_taxi__known_service_zones')
        rows:
          - {service_zone: 'Yellow Zone'}
    expect:
      rows:
        - {_source_row_number: 1, location_id: 7, location_id_count: 3, dq_fail_zone_location_id_duplicate: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_DUPLICATE'}
        - {_source_row_number: 2, location_id: 7, location_id_count: 3, dq_fail_zone_location_id_duplicate: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_DUPLICATE'}
        - {_source_row_number: 3, location_id: 7, location_id_count: 3, dq_fail_zone_location_id_duplicate: 1, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_DUPLICATE'}
        - {_source_row_number: 4, location_id: 8, location_id_count: 1, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 1, dq_reason_codes: null}
        - {_source_row_number: 5, location_id: null, location_id_count: 2, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_MISSING'}
        - {_source_row_number: 6, location_id: null, location_id_count: 2, dq_fail_zone_location_id_duplicate: 0, dq_is_valid: 0, dq_reason_codes: 'ZONE_LOCATION_ID_MISSING'}

  - name: trip_integer_cast_rules
    description: >
      The integer cast rules. Text that is not a number in the vendor, passenger count,
      rate code, pickup zone, dropoff zone or payment type column fails only that column's
      UNPARSEABLE rule. The text 1.0 parses as 1, 1.5 does not (it is not a whole number),
      and an empty cell (NULL) is never UNPARSEABLE. Every row below differs from the base
      row, so none of them is an exact duplicate of another. The base row, the zone and code
      lists of this test are reused by the trip tests that follow, through YAML anchors.
    model: bronze__nyc_taxi__yellow_trips
    given:
      - input: source('nyc_taxi', 'yellow_trips')
        rows:
          - &base_trip {vendorid: '1', tpep_pickup_datetime: '2024-01-15 08:00:00', tpep_dropoff_datetime: '2024-01-15 08:10:00', passenger_count: '1', trip_distance: '2.5', ratecodeid: '1', store_and_fwd_flag: 'N', pulocationid: '1', dolocationid: '2', payment_type: '1', fare_amount: '12.5', extra: '1.0', mta_tax: '0.5', tip_amount: '2.0', tolls_amount: '0.0', improvement_surcharge: '1.0', total_amount: '17.0', congestion_surcharge: '2.5', airport_fee: '0.0', cbd_congestion_fee: '0.0', _source_file: 'yellow_tripdata_2024-01.parquet', _source_row_number: 1, _batch_id: 'b1', _loaded_at: '2026-01-01 00:00:00'}
          - {<<: *base_trip, vendorid: 'abc', _source_row_number: 2}
          - {<<: *base_trip, passenger_count: 'abc', _source_row_number: 3}
          - {<<: *base_trip, ratecodeid: 'abc', _source_row_number: 4}
          - {<<: *base_trip, pulocationid: 'abc', _source_row_number: 5}
          - {<<: *base_trip, dolocationid: 'abc', _source_row_number: 6}
          - {<<: *base_trip, payment_type: 'abc', _source_row_number: 7}
          - {<<: *base_trip, vendorid: '1.0', _source_row_number: 8}
          - {<<: *base_trip, vendorid: '1.5', _source_row_number: 9}
          - {<<: *base_trip, vendorid: null, _source_row_number: 10}
      - input: ref('bronze__nyc_taxi__taxi_zones')
        rows: &zones_rows
          - {location_id: 1, dq_is_valid: 1}
          - {location_id: 2, dq_is_valid: 1}
          - {location_id: 264, dq_is_valid: 1}
          - {location_id: 265, dq_is_valid: 1}
          - {location_id: 77, dq_is_valid: 0}
      - input: ref('nyc_taxi__vendors')
        rows: &vendors_rows
          - {vendor_id: 1}
          - {vendor_id: 2}
          - {vendor_id: 6}
          - {vendor_id: 7}
      - input: ref('nyc_taxi__rate_codes')
        rows: &rates_rows
          - {rate_code_id: 1}
          - {rate_code_id: 99}
      - input: ref('nyc_taxi__payment_types')
        rows: &payments_rows
          - {payment_type: 0}
          - {payment_type: 1}
    expect:
      rows:
        - {_source_row_number: 1, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 2, vendor_id: null, dq_fail_trip_vendor_id_unparseable: 1, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 3, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 1, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 4, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 1, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 5, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 1, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 6, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 1, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 7, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 1}
        - {_source_row_number: 8, vendor_id: 1, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 9, vendor_id: null, dq_fail_trip_vendor_id_unparseable: 1, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}
        - {_source_row_number: 10, vendor_id: null, dq_fail_trip_vendor_id_unparseable: 0, dq_fail_trip_passenger_count_unparseable: 0, dq_fail_trip_rate_code_unparseable: 0, dq_fail_trip_pu_location_unparseable: 0, dq_fail_trip_do_location_unparseable: 0, dq_fail_trip_payment_type_unparseable: 0}

  - name: trip_decimal_and_time_cast_rules
    description: >
      The decimal and timestamp cast rules. Text that is not a number in the distance or in
      any of the ten money columns fails only that column's UNPARSEABLE rule. Text that is not
      a timestamp in the pickup or dropoff column (the word garbage, or a date that does not
      exist) fails that column's UNPARSEABLE rule. The pickup and dropoff cells are present,
      so the MISSING rules stay 0: each failure has one cause.
    model: bronze__nyc_taxi__yellow_trips
    given:
      - input: source('nyc_taxi', 'yellow_trips')
        rows:
          - {<<: *base_trip, _source_row_number: 1}
          - {<<: *base_trip, trip_distance: 'abc', _source_row_number: 2}
          - {<<: *base_trip, fare_amount: 'abc', _source_row_number: 3}
          - {<<: *base_trip, extra: 'abc', _source_row_number: 4}
          - {<<: *base_trip, mta_tax: 'abc', _source_row_number: 5}
          - {<<: *base_trip, tip_amount: 'abc', _source_row_number: 6}
          - {<<: *base_trip, tolls_amount: 'abc', _source_row_number: 7}
          - {<<: *base_trip, improvement_surcharge: 'abc', _source_row_number: 8}
          - {<<: *base_trip, total_amount: 'abc', _source_row_number: 9}
          - {<<: *base_trip, congestion_surcharge: 'abc', _source_row_number: 10}
          - {<<: *base_trip, airport_fee: 'abc', _source_row_number: 11}
          - {<<: *base_trip, cbd_congestion_fee: 'abc', _source_row_number: 12}
          - {<<: *base_trip, tpep_pickup_datetime: 'garbage', _source_row_number: 13}
          - {<<: *base_trip, tpep_pickup_datetime: '2024-13-45 99:99:99', _source_row_number: 14}
          - {<<: *base_trip, tpep_dropoff_datetime: 'garbage', _source_row_number: 15}
          - {<<: *base_trip, tpep_dropoff_datetime: '2024-13-45 99:99:99', _source_row_number: 16}
      - input: ref('bronze__nyc_taxi__taxi_zones')
        rows: *zones_rows
      - input: ref('nyc_taxi__vendors')
        rows: *vendors_rows
      - input: ref('nyc_taxi__rate_codes')
        rows: *rates_rows
      - input: ref('nyc_taxi__payment_types')
        rows: *payments_rows
    expect:
      rows:
        - {_source_row_number: 1, dq_fail_trip_distance_unparseable: 0, dq_fail_trip_fare_amount_unparseable: 0, dq_fail_trip_extra_unparseable: 0, dq_fail_trip_mta_tax_unparseable: 0, dq_fail_trip_tip_amount_unparseable: 0, dq_fail_trip_tolls_amount_unparseable: 0, dq_fail_trip_improvement_surcharge_unparseable: 0, dq_fail_trip_total_amount_unparseable: 0, dq_fail_trip_congestion_surcharge_unparseable: 0, dq_fail_trip_airport_fee_unparseable: 0, dq_fail_trip_cbd_congestion_fee_unparseable: 0, dq_fail_trip_pickup_datetime_unparseable: 0, dq_fail_trip_dropoff_datetime_unparseable: 0}
        - {_source_row_number: 2, dq_fail_trip_distance_unparseable: 1, dq_fail_trip_fare_amount_unparseable: 0, dq_fail_trip_extra_unparseable: 0, dq_fail_trip_mta_tax_unparseable: 0, dq_fail_trip_tip_amount_unparseable: 0, dq_fail_trip_tolls_amount_unparseable: 0, dq_fail_trip_improvement_surcharge_unparseable: 0, dq_fail_trip_total_amount_unparseable: 0, dq_fail_trip_congestion_surcharge_unparseable: 0, dq_fail_trip_airport_fee_unparseable: 0, dq_fail_trip_cbd_congestion_fee_unparseable: 0, dq_fail_trip_pickup_datetime_unparseable: 0, dq_fail_trip_dropoff_datetime_unparseable: 0}
