  - name: trip_time_rules
    description: >
      The time rules, with their boundaries. A pickup at the first second of the file month
      passes and one second earlier fails OUT_OF_MONTH; a pickup in 2001 fails it; a file
      name that holds no month fails it too. A dropoff one second before the pickup fails
      DROPOFF_BEFORE_PICKUP, while a dropoff equal to the pickup fails only the warn rule
      ZERO_LENGTH. A trip of exactly 24 hours passes and one second more fails
      DURATION_TOO_LONG. The last 2001-02 trip drops off in 2088: both times are clamped to
      the 2000 to 2050 window before the seconds are counted, so the duration stays below
      1,577,923,200 (inside a T-SQL int) and the trip still fails DURATION_TOO_LONG.
