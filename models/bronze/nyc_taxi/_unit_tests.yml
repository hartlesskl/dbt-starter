          - {<<: *base_trip, tpep_pickup_datetime: null, _source_row_number: 4}
          - {<<: *base_trip, passenger_count: '0', _source_row_number: 5}
          - {<<: *base_trip, passenger_count: null, _source_row_number: 6}
          - {<<: *base_trip, tpep_pickup_datetime: '2024-01-19 09:00:00', tpep_dropoff_datetime: '2024-01-19 09:00:00', passenger_count: '0', _source_row_number: 7}
      - input: ref('bronze__nyc_taxi__taxi_zones')
        rows: *zones_rows
      - input: ref('nyc_taxi__vendors')
        rows: *vendors_rows
      - input: ref('nyc_taxi__rate_codes')
        rows: *rates_rows
      - input: ref('nyc_taxi__payment_types')
        rows: *payments_rows
    expect:
