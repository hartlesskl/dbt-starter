version: 2

# The landing layer. The loader (not dbt) writes these tables, so this folder holds only
# the declaration: no model file belongs here.
sources:
  - name: nyc_taxi
    description: >
      NYC Taxi and Limousine Commission (TLC) published reference data, landed by the loader
      exactly as published: every data column is text, an empty cell is NULL, and four lineage
      columns say which file and run each row came from.
    schema: landing
    config:
      # Generous on purpose: the zone lookup changes rarely, and a kept demo database must
      # not go stale after a month. Real feeds should use thresholds that match their cadence.
      freshness:
        warn_after: {count: 400, period: day}
        error_after: {count: 800, period: day}
      loaded_at_field: _loaded_at
    tables:
      - name: taxi_zones
        identifier: nyc_taxi__taxi_zones
        description: >
          The TLC taxi zone lookup, one row per zone, as published in taxi_zone_lookup.csv.
          Values are untouched text, including the published placeholders N/A and Unknown.
          Zone names are not unique (ids 56 and 57 are both Corona), so no uniqueness test
          is placed on them.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [_source_file, _source_row_number]
          # Warn only: a column nobody declared yet lands as text, and this says it needs mapping.
          - starter.undeclared_columns:
              name: taxi_zones_undeclared_landing_columns
              config:
                severity: warn
        columns:
          - name: locationid
            description: Zone id as published, kept as text. Bronze converts it to an integer.
          - name: borough
            description: Borough name as published. The text N/A and Unknown are published values and are kept.
          - name: zone
            description: Zone name as published. Not unique across zones.
          - name: service_zone
            description: TLC service zone as published (for example Airports, Boro Zone, Yellow Zone, EWR or N/A).
          - name: _source_file
            description: Name of the file this row was loaded from. Together with _source_row_number it identifies the row.
          - name: _source_row_number
            description: Position of the row in its source file, counting from 1 in file order.
          - name: _batch_id
            description: Fingerprint of the file content (first 16 hex characters of its SHA-256). Identical files give the same value.
          - name: _loaded_at
            description: UTC time the loader wrote the row, without a time zone. Drives source freshness.
      - name: yellow_trips
        identifier: nyc_taxi__yellow_trips
        description: >
          Yellow taxi trip records, one row per trip, from the monthly files named
          yellow_tripdata_YYYY-MM.parquet. Each file is landed as published: every value is text,
          column names are lowercased (Airport_fee lands in airport_fee), a declared column that
          a month does not have is NULL, and a column nobody has declared yet is added to this
          table as text instead of failing the load. Bronze reads only the declared columns.
        data_tests:
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns: [_source_file, _source_row_number]
          # Warn only: a column nobody declared yet lands as text, and this says it needs mapping.
          - starter.undeclared_columns:
              name: yellow_trips_undeclared_landing_columns
              config:
                severity: warn
        columns:
          - name: vendorid
            description: Id of the provider that supplied the record (TLC data dictionary VendorID), as text.
          - name: tpep_pickup_datetime
            description: Date and time the meter was engaged, as text such as 2024-01-01 00:57:55.
          - name: tpep_dropoff_datetime
            description: Date and time the meter was disengaged, as text such as 2024-01-01 01:17:43.
          - name: passenger_count
            description: Number of passengers as entered by the driver, as text. Newer months carry a decimal such as 1.0 or NULL.
          - name: trip_distance
            description: Trip distance in miles reported by the taximeter, as text.
          - name: ratecodeid
            description: Rate code in effect at the end of the trip (RatecodeID), as text. NULL for some flex-fare trips.
          - name: store_and_fwd_flag
            description: Whether the record was held in vehicle memory before it was sent (Y or N), as text.
          - name: pulocationid
            description: Id of the taxi zone where the meter was engaged (PULocationID), as text.
          - name: dolocationid
            description: Id of the taxi zone where the meter was disengaged (DOLocationID), as text.
          - name: payment_type
            description: Numeric code for how the passenger paid, as text.
          - name: fare_amount
            description: Time-and-distance fare calculated by the meter, in dollars, as text.
          - name: extra
            description: Miscellaneous extras and surcharges, in dollars, as text.
          - name: mta_tax
            description: Tax triggered automatically by the metered rate, in dollars, as text.
          - name: tip_amount
            description: Tip, in dollars, as text. Cash tips are not included.
          - name: tolls_amount
            description: Total of all tolls paid during the trip, in dollars, as text.
          - name: improvement_surcharge
            description: Improvement surcharge assessed at flag drop, in dollars, as text.
          - name: total_amount
            description: Total charged to passengers, in dollars, as text. Cash tips are not included.
          - name: congestion_surcharge
            description: Total collected for New York State congestion surcharge, in dollars, as text.
          - name: airport_fee
            description: Fee for pickups at the two main airports, in dollars, as text. Published as Airport_fee in some months and absent in older ones.
          - name: cbd_congestion_fee
            description: Per-trip fee for the Manhattan congestion pricing zone, in dollars, as text. NULL for months before it existed.
          - name: _source_file
            description: Name of the file this row was loaded from. Together with _source_row_number it identifies the row, and bronze reads the month from it.
          - name: _source_row_number
            description: Position of the row in its source file, counting from 1 in file order.
          - name: _batch_id
            description: Fingerprint of the file content (first 16 hex characters of its SHA-256). Identical files give the same value.
          - name: _loaded_at
            description: UTC time the loader wrote the row, without a time zone. Drives source freshness.
