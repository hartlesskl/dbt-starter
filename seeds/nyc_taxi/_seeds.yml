version: 2

# Known-values lists for the zone lookup rules. Each seed has one column, so a rule can ask
# "is this value in the list" with a join that cannot multiply rows.
seeds:
  - name: nyc_taxi__known_boroughs
    description: >
      Borough names the TLC zone lookup is allowed to use, one per row. Unknown and N/A are
      valid published placeholder values and are listed on purpose: they name zones that are
      not in a real borough, and the boroughs rule must not quarantine them.
    config:
      column_types:
        borough: varchar(50)
    columns:
      - name: borough
        description: A borough name exactly as the TLC publishes it, including the placeholders Unknown and N/A. Matching is case sensitive.
        data_tests:
          - unique
          - not_null

  - name: nyc_taxi__known_service_zones
    description: >
      Service zone names the TLC zone lookup is allowed to use, one per row. Unknown and N/A
      are valid published placeholder values and are listed on purpose. The published file
      uses N/A for its unknown zones, and Unknown is listed so the same rule holds if that
      changes.
    config:
      column_types:
        service_zone: varchar(50)
    columns:
      - name: service_zone
        description: A service zone name exactly as the TLC publishes it, including the placeholders Unknown and N/A. Matching is case sensitive.
        data_tests:
          - unique
          - not_null

  - name: nyc_taxi__vendors
    description: >
      Vendor codes the TLC yellow trip data dictionary dated 2025-03-18 defines, one per row. A
      trip whose vendor id is not listed here fails TRIP_VENDOR_ID_UNKNOWN. Adding a code here
      re-releases the rows that failed it: the next build moves them from quarantine to silver.
    config:
      column_types:
        vendor_id: int
        vendor_name: varchar(60)
    columns:
      - name: vendor_id
        description: The vendor code as the TLC publishes it in the VendorID column.
        data_tests:
          - unique
          - not_null
      - name: vendor_name
        description: The vendor name the data dictionary dated 2025-03-18 gives for the code.
        data_tests:
          - not_null

  - name: nyc_taxi__rate_codes
    description: >
      Rate codes the TLC yellow trip data dictionary dated 2025-03-18 defines, one per row. A
      trip whose rate code is not listed here fails TRIP_RATE_CODE_UNKNOWN; a NULL rate code
      is allowed (Flex Fare trips carry none). Adding a code here re-releases the rows that
      failed it: the next build moves them from quarantine to silver.
    config:
      column_types:
        rate_code_id: int
        rate_code_name: varchar(60)
    columns:
      - name: rate_code_id
        description: The rate code as the TLC publishes it in the RatecodeID column. Code 99 is the published null or unknown code.
        data_tests:
          - unique
          - not_null
      - name: rate_code_name
        description: The rate name the data dictionary dated 2025-03-18 gives for the code.
        data_tests:
          - not_null

  - name: nyc_taxi__payment_types
    description: >
      Payment type codes the TLC yellow trip data dictionary dated 2025-03-18 defines, 0 to 6,
      one per row. A trip whose payment type is not listed here fails
      TRIP_PAYMENT_TYPE_UNKNOWN. Adding a code here re-releases the rows that failed it: the
      next build moves them from quarantine to silver.
    config:
      column_types:
        payment_type: int
        payment_type_name: varchar(60)
    columns:
      - name: payment_type
        description: The payment type code as the TLC publishes it in the payment_type column. Code 0 is a Flex Fare trip.
        data_tests:
          - unique
          - not_null
      - name: payment_type_name
        description: The payment type name the data dictionary dated 2025-03-18 gives for the code.
        data_tests:
          - not_null
