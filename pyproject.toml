[project]
name = "dbt-starter"
version = "0.1.0"
description = "A dbt starter with medallion layers, landing conventions and row quarantine, running on DuckDB and a Microsoft Fabric Lakehouse (Spark SQL)."
requires-python = ">=3.11,<3.14"
dependencies = [
    "dbt-core>=1.11.0,<1.12",
    "dbt-duckdb>=1.11.1,<1.12",
    "duckdb==2.0.1",
    "requests>=2.33",
]

[project.optional-dependencies]
fabric = ["dbt-fabricspark==1.12.2"]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "sqlglot>=30.33,<31",
    "ruff>=0.17.6",
    "sqlfluff>=4.5,<5",
    "sqlfluff-templater-dbt>=4.5,<5",
    "pre-commit>=4.7,<5",
]

[project.scripts]
demo = "starter_cli.demo:main"
load = "starter_cli.load:main"
gate = "starter_cli.gate:main"
site = "starter_cli.site:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/starter_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--import-mode=importlib -ra"
markers = [
    "network: needs internet access to download the example data",
    "gate_counts: exact counts on the gate's fixture database",
]

[tool.ruff]
line-length = 100
target-version = "py312"
