name: dbt_starter
version: "0.1.0"
config-version: 2
profile: dbt_starter

require-dbt-version: [">=1.11.0", "<1.12.0"]

flags:
  require_generic_test_arguments_property: true
  cache_selected_only: true

# One schema per layer. There is no `landing` key: the landing folder holds only the
# source declaration, and the loader (not dbt) creates the landing tables.
models:
  dbt_starter:
    bronze:
      +schema: bronze
      +materialized: table
      # Zone-less text is parsed in the Spark session zone; fail loudly unless it is UTC.
      +pre-hook: "{{ starter.ensure_utc_session() }}"
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

seeds:
  dbt_starter:
    +schema: bronze

# The inclusive calendar span of gold.dim_date. It is fixed and independent of the loaded
# data, so every build has the same calendar. The digits seed gives at most 10,000 days, and
# this span is 8,035.
vars:
  dim_date_start: "2009-01-01"
  dim_date_end: "2030-12-31"

data_tests:
  +store_failures: false

# Fabric's native dbt job ignores profiles.yml, so every run checks that the Spark session zone
# is UTC before any model (WR-04). On DuckDB the call does nothing.
on-run-start:
  - "{{ starter.ensure_utc_session() }}"

# Records every executed node and the invocation in verification.run_results and
# verification.invocations, but only where verification.run_results already exists (created by
# `verify-fabric init`). Without that table the hook writes nothing and creates no schema.
on-run-end:
  - "{{ starter.store_run_results(results) }}"

