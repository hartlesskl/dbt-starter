# The pull request gate: one job, one check named `gate`. It runs the same command as
# `make gate`, so a local run and a PR run cannot drift. No secret is used, no data is
# downloaded, and a fork's pull request runs with a read-only token.
name: gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same ref makes the older run pointless.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra fabric
      - run: uv run --locked --extra fabric gate
